{{define "index"}}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quake 3 Arena</title>
    <link rel="stylesheet" href="game.css">
    <script type="module" src="app/main.js"></script>
    <script type="text/javascript" src="ioquake3.js" defer></script>
    <link rel="apple-touch-icon" sizes="57x57" href="/images/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/images/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/images/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/images/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/images/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/images/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/images/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/images/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="/images/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/images/ms-icon-144x144.png">
    <meta name="theme-color" content="#000000">
    <style>
      .centered {
        position: fixed;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -60%); 
        z-index: 1;
      }
      .form input[type=text], [type=password] {
        margin: 8px 0;
        display: inline-block;
        border: 1px solid #ccc;
        box-shadow: inset 0 1px 3px #ddd;
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 16px;
        padding-bottom: 16px;
      }
      .form label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .status {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
      }
      .status.loading, .status.error { display: block; }
      .status.error a { color: #fe121e; }
      .button:focus-visible, .form input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .button {
        background-color: #fe121e;
        border: none;
        color: white;
        padding: 16px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="main">
      <div id="bg"></div>
      <div class="centered">
        <form class="form" id="join-form">
          <label for="playerName">Player name</label>
          <input type="text" id="playerName" maxlength="30" autocomplete="nickname" autofocus>
          {{ with .NeedsPass }}
            <label for="password">Server password</label>
            <input type="password" placeholder="password" id="password" autocomplete="current-password">
          {{ end }}
          <button type="submit" class="button">Join</button>
        </form>
      </div>
    </div>
    
    <div id="viewport-frame"></div>
  </body>
</html>
{{end}}
